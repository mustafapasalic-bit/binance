services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trader:${POSTGRES_PASSWORD:-trader}@db:5432/trader
    # Bound to localhost: reach the dashboard over an SSH tunnel or VPN, never the open internet.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
